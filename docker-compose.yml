services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    environment:
      - OFFLINE=${OFFLINE:-1}
      - ENGINE=${ENGINE:-bayes}
      - DEMO_PROFILE=${DEMO_PROFILE:-0}
    volumes:
      - ./demo-data:/app/demo-data
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_API=http://localhost:8000
    depends_on: [backend]
