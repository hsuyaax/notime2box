app = "silent-codriver-api"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  OFFLINE = "1"
  ENGINE = "bayes"
  DEMO_PROFILE = "0"
  DATA_DIR = "/data"

[[mounts]]
  source = "codriver_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
